document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B09;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Rajdhani';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"0a949a2f-8e97-4731-9878-2612f8c0f8a0\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Rajdhani';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7f9cb1da-8e0c-4254-af0e-641ec3dd017b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #04090C; }\n  a { color: #3FE0D0; text-decoration: none; border-bottom: 1px solid rgba(63,224,208,.3); }\n  a:hover { color: #8FF5EA; border-bottom-color: #8FF5EA; }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#04090C;color:#E4FAFF;font-family:'Rajdhani',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased\">\n\n  <div style=\"border-bottom:1px solid #14333B;background:#070D11;padding:34px 48px 26px\">\n    <div style=\"display:flex;align-items:flex-start;gap:40px;flex-wrap:wrap\">\n      <div style=\"flex:1;min-width:520px\">\n        <div style=\"display:flex;align-items:center;gap:12px;padding-bottom:10px\">\n          <div style=\"width:2px;height:16px;background:#3FE0D0\"><\u002Fdiv>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;color:#3FE0D0\">KUBESCOPE · PANEL-TERV<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#3B565E\">válasz a brief-panel/00-panel-brief.md-re<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:32px;font-weight:700;letter-spacing:.02em;line-height:1.15;padding-bottom:12px\">Két sáv, két család, egy szabály<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:23px;color:#A9C4CB;max-width:840px;text-wrap:pretty\">A keret adott, és nem nyúlok hozzá. Ez a panel belseje: <span style=\"color:#E4FAFF\">a fejléc azt hordozza, ami újralistázást okoz, a vezérlősáv azt, ami nem<\u002Fspan>. Ebből az egy szabályból következik a hatókör helye, a csipeszek grammatikája, a degradáció sorrendje és a hat típus váza — tehát a következő öt paneltípushoz nem kell újra megkérdezned.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:332px;border:1px solid #14333B;background:#0F1D24;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))\">\n        <div style=\"padding:10px 14px;border-bottom:1px solid #14333B;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:#A06BFF\">A HÁROM SZÁM<\u002Fdiv>\n        <div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:9px\">\n          <div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:19px;color:#3FE0D0\">2<\u002Fspan><span style=\"font-size:12.5px;line-height:16px;color:#A9C4CB\">sáv a panelben, nem három — <a href=\"#savok\">lábléc nincs<\u002Fa><\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:19px;color:#3FE0D0\">54<\u002Fspan><span style=\"font-size:12.5px;line-height:16px;color:#A9C4CB\">px panel-króm compact módban (28 + 26), a tábla fejsora nélkül<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:19px;color:#3FE0D0\">320<\u002Fspan><span style=\"font-size:12.5px;line-height:16px;color:#A9C4CB\">px-en még tábla van, nem helyettes nézet — <a href=\"#szelessegek\">03-as rajz<\u002Fa><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:7px;padding-top:22px\">\n      <sc-for list=\"{{ navChips }}\" as=\"c\" hint-placeholder-count=\"12\">\n        <a href=\"{{ c.1 }}\" style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:#A9C4CB;border:1px solid #14333B;padding:4px 10px;background:#0F1D24\" style-hover=\"color:#8FF5EA;border-color:#2FB9AC\">{{ c.0 }}<\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"szabaly\" style=\"padding:34px 48px;border-bottom:1px solid #14333B\">\n    <div style=\"display:flex;align-items:center;gap:14px;padding-bottom:8px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:#A06BFF\">§1<\u002Fspan>\n      <span style=\"font-size:20px;font-weight:600\">A szabály, amiből minden más következik<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5E7F88\">a brief 5.2 kérdése · ez a terv gerince<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:13px;line-height:19px;color:#A9C4CB;max-width:1000px;padding-bottom:20px\">A brief maga adta meg a különbséget: a cluster kapcsolat, a namespace <span style=\"color:#E4FAFF\">is<\u002Fspan> kapcsolat, a <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">status:<\u002Fspan> viszont csak szűrés a megkapott sorokon. A kérdés az volt, látszania kell-e. <span style=\"color:#E4FAFF\">Igen — és helyen látszik, nem színen<\u002Fspan>, mert a szín már foglalt a státuszra.<\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px\">\n      <div style=\"border:1px solid #1E4C57;background:rgba(63,224,208,.05);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))\">\n        <div style=\"padding:11px 16px;border-bottom:1px solid #1E4C57;display:flex;align-items:baseline;gap:11px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#3FE0D0\">FEJLÉC · 28 PX<\u002Fspan>\n          <span style=\"font-size:12.5px;color:#A9C4CB\">amit átállítva a panel újralistáz<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:14px 16px;font-size:13px;line-height:19.5px;color:#C9E3E8;text-wrap:pretty\">Cluster és namespace — mindkettő, egy útvonalban: <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#8FF5EA\">orbstack · kube-system<\u002Fspan>. Ezek szerveroldali szűkítések: átállításuk új watch, új sorok, üres tábla egy pillanatra. <span style=\"color:#E4FAFF\">A panel identitása<\u002Fspan> — ha ez elveszik, két panel megkülönböztethetetlen.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #14333B;background:#0F1D24\">\n        <div style=\"padding:11px 16px;border-bottom:1px solid #14333B;display:flex;align-items:baseline;gap:11px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#A06BFF\">VEZÉRLŐSÁV · 26 PX<\u002Fspan>\n          <span style=\"font-size:12.5px;color:#A9C4CB\">amit átállítva nem történik hálózati kérés<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:14px 16px;font-size:13px;line-height:19.5px;color:#C9E3E8;text-wrap:pretty\">Név-részlet, <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">status:<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">node:<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">label:<\u002Fspan>, rendezés. Kliensoldali munka a már birtokolt halmazon: azonnali, visszavonható, nem üríti a táblát. <span style=\"color:#E4FAFF\">A panel kérdésfeltevése<\u002Fspan>, nem az identitása.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:16px;padding-top:16px;flex-wrap:wrap\">\n      <div style=\"flex:1;min-width:300px;border-left:2px solid #7EE08A;padding-left:14px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:#7EE08A;padding-bottom:4px\">EZ VÁLTOZÁS A MAI ÁLLAPOTHOZ KÉPEST<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:18px;color:#A9C4CB\">A mai vágás — cluster a fejlécben, namespace a szűrősorban — <span style=\"color:#E4FAFF\">rossz helyen húzza a vonalat<\u002Fspan>: a kettő ugyanabba a kategóriába tartozik. A namespace felkerül a fejlécbe. Ezzel a <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">ns:<\u002Fspan> csipesz megszűnik, és vele a szürke/cián szabálya is.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:300px;border-left:2px solid #FFB454;padding-left:14px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:#FFB454;padding-bottom:4px\">MIÉRT NEM ELÉG A SZÍN VAGY AZ ALAK<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:18px;color:#A9C4CB\">Színt nem adhatok: a cián interakció, a lila szerkezet, a többi státusz. Alakot adhatnék (kapcsolat = kerek, szűrés = szögletes), de az <span style=\"color:#E4FAFF\">megtanulandó jel<\u002Fspan>. A hely nem: két sáv fizikailag más helyen van, és a felhasználó másodszorra már tudja.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:300px;border-left:2px solid #3FE0D0;padding-left:14px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:#3FE0D0;padding-bottom:4px\">A JÖVŐBELI ESETEKRE<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:18px;color:#A9C4CB\">Egy új paraméternél egyetlen kérdés dönt: <span style=\"color:#E4FAFF\">okoz-e hálózati kérést?<\u002Fspan> A <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">label<\u002Fspan>-szelektor például <span style=\"color:#E4FAFF\">lehet mindkettő<\u002Fspan> — ha szerveroldali, fejléc; ha kliensoldali, vezérlősáv. Ugyanaz a szó, két hely, és a szabály megmondja, melyik.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"csaladok\" style=\"padding:34px 48px;border-bottom:1px solid #14333B;background:#070D11\">\n    <div style=\"display:flex;align-items:center;gap:14px;padding-bottom:8px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:#A06BFF\">§2<\u002Fspan>\n      <span style=\"font-size:20px;font-weight:600\">A két család — kérdés-panel és tárgy-panel<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5E7F88\">a brief 4.1 kulcskérdése<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:13px;line-height:19px;color:#A9C4CB;max-width:1020px;padding-bottom:20px\">Ugyanaz a sáv hordozza mindkettőt, <span style=\"color:#E4FAFF\">de a hatókör-cella két alakot vesz fel<\u002Fspan>, és a különbség egyetlen jelben áll: <span style=\"color:#E4FAFF\">keret és ▾ = átállítható; keret nélkül = adottság<\u002Fspan>. Ez nem új nyelv — a design system <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">Field<\u002Fspan> és címke megkülönböztetése, ugyanaz a szabály egy szinttel beljebb.<\u002Fdiv>\n\n    <div style=\"border:1px solid #14333B;background:#0F1D24;padding:26px 30px 22px\">\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:30px\">\n        <div>\n          <div style=\"display:flex;align-items:baseline;gap:10px;padding-bottom:10px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#3FE0D0\">KÉRDÉS-PANEL<\u002Fspan>\n            <span style=\"font-size:12.5px;color:#5E7F88\">PODS · NODES · EVENTS<\u002Fspan>\n          <\u002Fdiv>\n          {{ headerQuestion }}\n          <div style=\"padding-top:12px;font-size:12.5px;line-height:18px;color:#A9C4CB\">A cím a <span style=\"color:#E4FAFF\">típus<\u002Fspan>, mert a tárgy egy osztály. A hatókör keretben áll, ▾-vel: kattintásra a flotta listája nyílik alatta, ahogy ma. Két szegmens, mert a namespace is kapcsolat.<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;align-items:baseline;gap:10px;padding-bottom:10px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#A06BFF\">TÁRGY-PANEL<\u002Fspan>\n            <span style=\"font-size:12.5px;color:#5E7F88\">LOGS · YAML · SHELL<\u002Fspan>\n          <\u002Fdiv>\n          {{ headerObject }}\n          <div style=\"padding-top:12px;font-size:12.5px;line-height:18px;color:#A9C4CB\">A cím az <span style=\"color:#E4FAFF\">objektum neve<\u002Fspan>, mert a tárgy egy egyed — a típust a glif hordozza, tehát nem veszik el semmi. A hatókör keret nélkül, ▾ nélkül: közlés.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-top:22px;margin-top:20px;border-top:1px solid #12242C\">\n        <div style=\"border-left:2px solid #3FE0D0;padding-left:13px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:#3FE0D0;padding-bottom:4px\">ÍGY FÉR BELE A 28 PIXELBE<\u002Fdiv>\n          <div style=\"font-size:12.5px;line-height:18px;color:#A9C4CB\">A brief kérdése az volt, elfér-e a hosszabb azonosító. Elfér, mert <span style=\"color:#E4FAFF\">a cím helyét használja fel<\u002Fspan>: a tárgy-panelnél a típuscímke redundáns a glif mellett, tehát az objektum neve kapja a helyét. Nem kell második sor, és nem kell 28-nál magasabb fejléc — az a keret szerződése.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-left:2px solid #A06BFF;padding-left:13px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:#A06BFF;padding-bottom:4px\">A CSONKÍTÁS SORRENDJE ITT MÁS<\u002Fdiv>\n          <div style=\"font-size:12.5px;line-height:18px;color:#A9C4CB\">Kérdés-panelnél a cím rövid és állandó, az útvonal csonkul. Tárgy-panelnél <span style=\"color:#E4FAFF\">a cím a legértékesebb<\u002Fspan> — két log-panel egymás mellett a pod-nevében különbözik —, tehát ott az útvonal esik ki előbb, és a név csonkul utolsóként. A <a href=\"#degradacio\">§5<\u002Fa> ezt sorrendben kiírja.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-left:2px solid #FF4D6D;padding-left:13px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:#FF4D6D;padding-bottom:4px\">ELVETVE<\u002Fdiv>\n          <div style=\"font-size:12.5px;line-height:18px;color:#A9C4CB\"><span style=\"color:#E4FAFF\">Két különböző fejléc-szerkezet:<\u002Fspan> a fejléc a keret fogantyúja, egy magassággal és egy geometriával — két változat két drag-viselkedést és két degradációs táblát szülne. <span style=\"color:#E4FAFF\">44 px-es fejléc a tárgy-paneleknek:<\u002Fspan> 16 px króm mindenhol, ahol a legkevesebb hely van, és a keret 28-as szerződését sérti.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"savok\" style=\"padding:34px 48px;border-bottom:1px solid #14333B\">\n    <div style=\"display:flex;align-items:center;gap:14px;padding-bottom:8px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:#A06BFF\">§3<\u002Fspan>\n      <span style=\"font-size:20px;font-weight:600\">A panel anatómiája<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5E7F88\">a brief 5.1 · pixelben, két sűrűségen<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:13px;line-height:19px;color:#A9C4CB;max-width:1000px;padding-bottom:20px\">Két sáv és egy tartalom. <span style=\"color:#E4FAFF\">Lábléc nincs<\u002Fspan>, és ez döntés, nem hiány — az indoklás a táblázat alatt.<\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 420px;gap:22px;align-items:start\">\n      <div style=\"border:1px solid #14333B;background:#0F1D24\">\n        <div style=\"display:grid;grid-template-columns:158px 74px 74px 1fr;padding:8px 18px;border-bottom:1px solid #14333B;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:#4C6B74\">\n          <div>SÁV<\u002Fdiv><div style=\"text-align:right\">COMPACT<\u002Fdiv><div style=\"text-align:right\">COMFY<\u002Fdiv><div style=\"padding-left:18px\">MI DÖNTI EL, HOGY VAN-E<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ bands }}\" as=\"b\" hint-placeholder-count=\"7\">\n          <div style=\"display:grid;grid-template-columns:158px 74px 74px 1fr;padding:9px 18px;border-bottom:1px solid #0E1E24;align-items:baseline\">\n            <div style=\"display:flex;align-items:baseline;gap:8px\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;color:{{ b.tagColor }};border:1px solid {{ b.tagColor }};padding:0 4px\">{{ b.tag }}<\u002Fspan>\n              <span style=\"font-size:12.5px;color:#E4FAFF\">{{ b.name }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:{{ b.pxColor }};text-align:right\">{{ b.compact }}<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:{{ b.pxColor }};text-align:right\">{{ b.comfy }}<\u002Fspan>\n            <span style=\"font-size:12.5px;line-height:17.5px;color:#A9C4CB;padding-left:18px\">{{ b.rule }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"padding:12px 18px;display:grid;grid-template-columns:158px 74px 74px 1fr\">\n          <span style=\"font-size:12.5px;color:#A06BFF\">Panel-króm összesen<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#A06BFF;text-align:right\">{{ chromeCompact }}<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#A06BFF;text-align:right\">{{ chromeComfy }}<\u002Fspan>\n          <span style=\"font-size:12px;line-height:17px;color:#8FA9B2;padding-left:18px\">Vezérlősávos típusnál. A tábla oszlopfejléce a tartalom része, nem króm — a <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">Table<\u002Fspan> widget hozza.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"border:1px solid #5A2038;background:#0F1D24\">\n          <div style=\"padding:11px 16px;border-bottom:1px solid #5A2038;display:flex;align-items:center;gap:9px\">\n            <div style=\"width:2px;height:11px;background:#FF4D6D\"><\u002Fdiv>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#FF4D6D\">LÁBLÉC: NEM<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:13px 16px;font-size:12.5px;line-height:18px;color:#C9E3E8;text-wrap:pretty\">Amit a lábléc adna, azt már két hely adja: a <span style=\"color:#E4FAFF\">darabszám és a stream-állapot<\u002Fspan> a vezérlősáv jobb szélén (ott, ahol a szűrő is — mert a szám a szűrés eredménye), a globális összesítés pedig a keret alsó sávjában. Egy harmadik sáv 300 px-es panelben 22 px-ért <span style=\"color:#E4FAFF\">egy pod-sort<\u002Fspan> vinne el, és semmit nem tudna, amit a másik kettő nem.<\u002Fdiv>\n          <div style=\"padding:0 16px 13px;font-size:12px;line-height:17px;color:#8FA9B2\">Kivétel, amiért mégis lehetne — és nincs: a <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">YamlEditor<\u002Fspan> mentés-gombja. Az a <a href=\"#tipusok\">§8<\u002Fa> szerint a vezérlősáv jobb szélére kerül, mert ott van a többi vezérlő is.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #14333B;background:#0F1D24\">\n          <div style=\"padding:11px 16px;border-bottom:1px solid #14333B;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#A06BFF\">BELSŐ MARGÓK<\u002Fdiv>\n          <sc-for list=\"{{ margins }}\" as=\"m\" hint-placeholder-count=\"5\">\n            <div style=\"display:grid;grid-template-columns:1fr 62px;padding:6px 16px;border-bottom:1px solid #0E1E24;align-items:baseline\">\n              <span style=\"font-size:12.5px;color:#A9C4CB\">{{ m.k }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#8FF5EA;text-align:right\">{{ m.v }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"padding:11px 16px;font-size:12px;line-height:17px;color:#8FA9B2\">A 10 px vízszintes margó a design system 4-es rácsából jön, és <span style=\"color:#C9E3E8\">nem<\u002Fspan> csökken keskeny panelben — a csökkentése az első dolog, amit ki lehetne találni, és a legrosszabb: a szöveg a kerethez tapadna.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"szelessegek\" style=\"padding:34px 48px;border-bottom:1px solid #14333B;background:#070D11\">\n    <div style=\"display:flex;align-items:center;gap:14px;padding-bottom:8px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:#A06BFF\">§4<\u002Fspan>\n      <span style=\"font-size:20px;font-weight:600\">A PODS panel három szélességen<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5E7F88\">1600 · 700 · 320 px · arányhelyes, a típus 0,68-ra kicsinyítve<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:13px;line-height:19px;color:#A9C4CB;max-width:1000px;padding-bottom:22px\">Ugyanaz a panel, ugyanaz az adat, három szélességen. A rajzok <span style=\"color:#E4FAFF\">egy skálán<\u002Fspan> vannak, tehát egymás mellé tehetők — a pixelértékek teljes méretben értendők. <span style=\"color:#E4FAFF\">Mindhárom szűrés nélkül áll<\u002Fspan>, szándékosan: itt a degradáció a tárgy, és egy aktív szűrő ugyanezen a rajzon egyszerre két dolgot magyarázna. A szűrő a <a href=\"#grammatika\">§5<\u002Fa>-ben és a <a href=\"#allapotok\">§7/05<\u002Fa>-ben szerepel, ott, ahol a csipesz, a darabszám és a sorok együtt igazolják egymást.<\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:26px\">\n      <div>\n        <div style=\"display:flex;align-items:baseline;gap:13px;padding-bottom:10px;flex-wrap:wrap\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#3FE0D0\">01<\u002Fspan>\n          <span style=\"font-size:16px;font-weight:600\">1600 px — egyedül a munkaterületen<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5E7F88\">minden látszik · 7 oszlop · nincs mit eldönteni<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #14333B;background:#04090C;padding:14px;display:inline-block\">{{ podsWide }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start\">\n        <div>\n          <div style=\"display:flex;align-items:baseline;gap:13px;padding-bottom:10px;flex-wrap:wrap\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#3FE0D0\">02<\u002Fspan>\n            <span style=\"font-size:16px;font-weight:600\">700 px — kettéosztva<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5E7F88\">a NODE oszlop kiesett<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #14333B;background:#04090C;padding:14px;display:inline-block\">{{ podsMid }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;align-items:baseline;gap:13px;padding-bottom:10px;flex-wrap:wrap\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#3FE0D0\">03<\u002Fspan>\n            <span style=\"font-size:16px;font-weight:600\">320 px — négyfelé<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5E7F88\">más szerkezet<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #14333B;background:#04090C;padding:14px;display:inline-block\">{{ podsNarrow }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-top:20px\">\n      <sc-for list=\"{{ widthNotes }}\" as=\"w\" hint-placeholder-count=\"3\">\n        <div style=\"border-left:2px solid {{ w.color }};padding-left:14px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:{{ w.color }};padding-bottom:4px\">{{ w.k }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;line-height:18px;color:#A9C4CB\">{{ w.v }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"grammatika\" style=\"padding:34px 48px;border-bottom:1px solid #14333B\">\n    <div style=\"display:flex;align-items:center;gap:14px;padding-bottom:8px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:#A06BFF\">§5<\u002Fspan>\n      <span style=\"font-size:20px;font-weight:600\">A vezérlősáv grammatikája<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5E7F88\">a brief 5.3 · mikor csipesz, mikor mező, mikor menü<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:13px;line-height:19px;color:#A9C4CB;max-width:1020px;padding-bottom:20px\">Egy szabály három alakra: <span style=\"color:#E4FAFF\">a mező nyitott szöveghez, a csipesz zárt értékkészlethez, a menü a csipesz értékéhez<\u002Fspan>. Ha egy dimenzió lehetséges értékeit a kliens ismeri (mert a sorokban benne vannak), csipesz; ha nem ismerheti, mező.<\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n      <div style=\"border:1px solid #14333B;background:#0F1D24\">\n        <div style=\"padding:11px 16px;border-bottom:1px solid #14333B;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#A06BFF\">A HÁROM ALAK<\u002Fdiv>\n        <sc-for list=\"{{ grammar }}\" as=\"g\" hint-placeholder-count=\"3\">\n          <div style=\"padding:13px 16px;border-bottom:1px solid #0E1E24;display:grid;grid-template-columns:126px 1fr;gap:14px;align-items:start\">\n            <div>{{ g.sample }}<\u002Fdiv>\n            <div>\n              <div style=\"display:flex;align-items:baseline;gap:9px;padding-bottom:3px\">\n                <span style=\"font-size:13px;font-weight:600;color:#E4FAFF\">{{ g.name }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:{{ g.color }}\">{{ g.widget }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:12.5px;line-height:17.5px;color:#A9C4CB\">{{ g.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"padding:12px 16px;font-size:12px;line-height:17px;color:#8FA9B2\">A tagadás a csipesz saját menüjében kapcsoló, nem külön szintaxis: az operátor <span style=\"color:#C9E3E8\">a csipeszben, ciánnal<\u002Fspan> jelenik meg — <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">status ≠ Running<\u002Fspan>. Így a tagadás <span style=\"color:#C9E3E8\">látszik<\u002Fspan>, nem egy beírt karakteren múlik, és a csipesz továbbra is egy kattintással törölhető.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <div style=\"border:1px solid #14333B;background:#0F1D24\">\n          <div style=\"padding:11px 16px;border-bottom:1px solid #14333B;display:flex;align-items:baseline;gap:11px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#A06BFF\">HAT CSIPESZ 300 PX-EN<\u002Fspan>\n            <span style=\"font-size:12px;color:#5E7F88\">a brief kifejezett kérdése<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:16px;background:#04090C\">{{ chipCollapse }}<\u002Fdiv>\n          <div style=\"padding:13px 16px;font-size:12.5px;line-height:18px;color:#C9E3E8;text-wrap:pretty\"><span style=\"color:#E4FAFF\">Összecsukás egyetlen csipeszbe<\u002Fspan>, kattintásra lebegő menüben a teljes lista. A tördelés egy 23 px-es sort visz el, ami pont <span style=\"color:#E4FAFF\">egy pod<\u002Fspan> — a legkeskenyebb panelben a legdrágább csere. A vízszintes görgetés rosszabb: <span style=\"color:#E4FAFF\">elrejt egy aktív szűrőt<\u002Fspan>, és a rejtett aktív szűrő incidens közben azt hiteti el, hogy mindent látsz.<\u002Fdiv>\n          <div style=\"padding:0 16px 14px;font-size:12px;line-height:17px;color:#8FA9B2\">Az összecsukott csipesz <span style=\"color:#C9E3E8\">cián<\u002Fspan>, mert szűkít — ez az egyetlen hely, ahol a szűrő szín-csatornát használ, és azért itt, mert itt nem látszik a tartalma.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #14333B;background:#0F1D24\">\n          <div style=\"padding:11px 16px;border-bottom:1px solid #14333B;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#7EE08A\">A BŐVÍTÉS ÚTJA<\u002Fdiv>\n          <sc-for list=\"{{ expansion }}\" as=\"e\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid;grid-template-columns:104px 1fr;gap:13px;padding:8px 16px;border-bottom:1px solid #0E1E24;align-items:baseline\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8FF5EA\">{{ e.k }}<\u002Fspan>\n              <span style=\"font-size:12.5px;line-height:17.5px;color:#A9C4CB\">{{ e.v }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"degradacio\" style=\"padding:34px 48px;border-bottom:1px solid #14333B;background:#070D11\">\n    <div style=\"display:flex;align-items:center;gap:14px;padding-bottom:8px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:#A06BFF\">§6<\u002Fspan>\n      <span style=\"font-size:20px;font-weight:600\">Degradáció — mi esik ki, milyen sorrendben<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5E7F88\">a brief 5.4 · kimondott sorrend, nem ad hoc<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:13px;line-height:19px;color:#A9C4CB;max-width:1020px;padding-bottom:20px\">A rendező elv: <span style=\"color:#E4FAFF\">először a szó megy, aztán a redundancia, végül az azonosság — és az azonosság soha nem megy el teljesen<\u002Fspan>. Ahol egy szó és egy jel ugyanazt mondja, a szó esik ki (a pötty marad), mert a jel kisebb és a szín amúgy is hordozza.<\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n      <sc-for list=\"{{ degradation }}\" as=\"d\" hint-placeholder-count=\"2\">\n        <div style=\"border:1px solid #14333B;background:#0F1D24\">\n          <div style=\"padding:11px 16px;border-bottom:1px solid #14333B;display:flex;align-items:baseline;gap:11px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:{{ d.color }}\">{{ d.band }}<\u002Fspan>\n            <span style=\"font-size:12px;color:#5E7F88\">{{ d.note }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ d.steps }}\" as=\"st\" hint-placeholder-count=\"5\">\n            <div style=\"display:grid;grid-template-columns:26px 1fr 82px;gap:11px;padding:8px 16px;border-bottom:1px solid #0E1E24;align-items:baseline\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:{{ st.nColor }}\">{{ st.n }}<\u002Fspan>\n              <div>\n                <span style=\"font-size:12.5px;color:#E4FAFF\">{{ st.what }}<\u002Fspan>\n                <div style=\"font-size:12px;line-height:17px;color:#8FA9B2;padding-top:2px\">{{ st.why }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:{{ st.pxColor }};text-align:right\">{{ st.px }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;padding-top:18px\">\n      <div style=\"border:1px solid #1E4C57;background:rgba(63,224,208,.05);padding:15px 18px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#3FE0D0;padding-bottom:8px\">A SZERKEZETI HATÁR: 420 PX<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:19.5px;color:#C9E3E8;text-wrap:pretty\">Egy határ van, ahol a panel <span style=\"color:#E4FAFF\">más szerkezetet<\u002Fspan> vesz fel, nem csak keskenyebbet. 420 px alatt a tábla <span style=\"color:#E4FAFF\">kétsoros sorokra<\u002Fspan> vált: felül a név, alatta a státusz és a kor. A sormagasság 23-ról 34-re nő, tehát <span style=\"color:#E4FAFF\">kevesebb sor látszik<\u002Fspan> — de a név egészben olvasható, és pont a név az, amiért a panelt nyitottad. Csonkolt névsor négyfelé osztott képernyőn hasznavehetetlen.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #14333B;background:#0F1D24;padding:15px 18px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#FFB454;padding-bottom:8px\">MEDDIG LEHET OSZTANI — SZÁMOLVA, NEM KITALÁLVA<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:19.5px;color:#C9E3E8;text-wrap:pretty\">Nem adok új számot: a keret minimuma <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">320 × 180<\u002Fspan>, és ebből következik, hogy a <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">⊞<\u002Fspan> <span style=\"color:#E4FAFF\">643 px alatt elhalványul<\u002Fspan> (320 + 3 osztásfogó + 320). A keret ezt eddig is visszautasította volna — a különbség annyi, hogy most <span style=\"color:#E4FAFF\">előre látszik<\u002Fspan>, tehát nincs olyan kattintás, ami némán nem történik meg.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"allapotok\" style=\"padding:34px 48px;border-bottom:1px solid #14333B\">\n    <div style=\"display:flex;align-items:center;gap:14px;padding-bottom:8px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:#A06BFF\">§7<\u002Fspan>\n      <span style=\"font-size:20px;font-weight:600\">A nyolc állapot<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5E7F88\">a brief 5.5 · 700 px-en, 0,52-es skálán<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:13px;line-height:19px;color:#A9C4CB;max-width:1020px;padding-bottom:20px\">A tábla ritkán van tele és rendben. A nyolc közül <span style=\"color:#E4FAFF\">az utolsó kettő a fontos<\u002Fspan>: ott sorok állnak a képernyőn, és el kell dőlnie, hogyan néz ki egy panel, ami igazat mutat, de nem frissül.<\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px\">\n      <sc-for list=\"{{ states }}\" as=\"s\" hint-placeholder-count=\"8\">\n        <div>\n          <div style=\"display:flex;align-items:baseline;gap:10px;padding-bottom:8px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:{{ s.color }}\">{{ s.n }}<\u002Fspan>\n            <span style=\"font-size:14px;font-weight:600\">{{ s.name }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #14333B;background:#04090C;padding:10px;display:inline-block\">{{ s.render }}<\u002Fdiv>\n          <div style=\"padding-top:9px;font-size:12.5px;line-height:18px;color:#A9C4CB\">{{ s.desc }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #5A4520;background:rgba(255,180,84,.05);margin-top:22px;display:grid;grid-template-columns:3px 1fr\">\n      <div style=\"background:#FFB454\"><\u002Fdiv>\n      <div style=\"padding:15px 18px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#FFB454;padding-bottom:9px\">AZ ÁLLOTT TÁBLA — A KÉT UTOLSÓ ÁLLAPOT DÖNTÉSE<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px\">\n          <div style=\"font-size:13px;line-height:19.5px;color:#C9E3E8;text-wrap:pretty\"><span style=\"color:#E4FAFF\">A sorok érintetlenek maradnak — nem tompulnak, nem szürkülnek.<\u002Fspan> Ez szándékos: a tompítás azt sugallná, hogy az adat kevésbé igaz, holott pontosan igaz, csak régi. Amit a panel tesz helyette: <span style=\"color:#E4FAFF\">egy 22 px-es állott-csík<\u002Fspan> a vezérlősáv alatt, a design system 45°-os sraffozásával — azzal a textúrával, amit a készlet eleve az „ismeretlen / állott\" jelentésre tart.<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:19.5px;color:#C9E3E8;text-wrap:pretty\">A csíkon <span style=\"color:#E4FAFF\">a kor számszerűen<\u002Fspan> fut, másodpercenként: <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">utolsó jó állapot 14:02:18 · 3 m 12 s<\u002Fspan>. Ez az, ami elválasztja a megállt táblát a nyugodt clustertől — a nyugodt clusterben nincs csík. <span style=\"color:#8FA9B2\">Ezért nem elég a fejléc pöttye: az „elveszett\" és a „minden rendben, csak nincs mozgás\" ugyanúgy néz ki, ha csak egy pötty van, és pont az incidens alatt számít a különbség.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"kijeloles\" style=\"padding:34px 48px;border-bottom:1px solid #14333B;background:#070D11\">\n    <div style=\"display:flex;align-items:center;gap:14px;padding-bottom:8px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:#A06BFF\">§8<\u002Fspan>\n      <span style=\"font-size:20px;font-weight:600\">Kijelölés, új panel, fókusz, fülek<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5E7F88\">a brief 5.6 · 5.7 · 5.8<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px\">\n      <div style=\"border:1px solid #14333B;background:#0F1D24\">\n        <div style=\"padding:11px 16px;border-bottom:1px solid #14333B;display:flex;align-items:baseline;gap:10px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#3FE0D0\">5.6 · KIJELÖLÉS<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:14px 16px;font-size:12.5px;line-height:18px;color:#C9E3E8;text-wrap:pretty\">Egy sorra kattintva <span style=\"color:#E4FAFF\">semmi nem nyílik<\u002Fspan>. A kijelölés hivatkozás, nem navigáció: 10% cián kitöltés és 2 px cián bal jel, és ez az, amire a következő gesztus mutat. Nyitás négy úton: jobbklikk, <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">⏎<\u002Fspan> (elsődleges = Áttekintés), <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">L Y E<\u002Fspan> gyorsbetűk, és a fejléc <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">⊞<\u002Fspan> menüje.<\u002Fdiv>\n        <div style=\"padding:0 16px 14px\">\n          <div style=\"border-top:1px solid #12242C;padding-top:11px;font-size:12.5px;line-height:18px;color:#A9C4CB\"><span style=\"color:#E4FAFF\">Örökli-e a szűkítést?<\u002Fspan> A hatókört igen, a szűrést nem — <span style=\"color:#C9E3E8\">kivéve, ha a gyerek ugyanaz a típus<\u002Fspan>. Egy <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">status ≠ Running<\u002Fspan> szűrő értelmes egy másik PODS panelben, és értelmetlen egy LOGS panelben: az egy objektumról szól, nem sok sorról.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #14333B;background:#0F1D24\">\n        <div style=\"padding:11px 16px;border-bottom:1px solid #14333B;display:flex;align-items:baseline;gap:10px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#A06BFF\">5.7 · FÓKUSZ A PANELEN BELÜL<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:14px 16px;font-size:12.5px;line-height:18px;color:#C9E3E8;text-wrap:pretty\"><span style=\"color:#E4FAFF\">Két megálló van, nem több<\u002Fspan>: a vezérlősáv és a tartalom. A <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">Tab<\u002Fspan> a kettő között vált, a sávon belül <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">←→<\u002Fspan> lép csipeszről csipeszre. Belépés a keretből: <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">⌘.<\u002Fspan> vagy <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">⏎<\u002Fspan>; kilépés <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">Esc<\u002Fspan>.<\u002Fdiv>\n        <div style=\"padding:0 16px 14px\">\n          <div style=\"border-top:1px solid #12242C;padding-top:11px;font-size:12.5px;line-height:18px;color:#A9C4CB\">A fókuszgyűrű a megállón jelenik meg, <span style=\"color:#E4FAFF\">a kijelölés viszont külön csatorna<\u002Fspan> — egy fókuszált szűrőmező mellett a kijelölt sor is látszik, mert a kettő nem ugyanazt mondja. Ez az egyetlen hely a készletben, ahol két jelölés egyszerre áll a panelen, és pont ezért nem ugyanaz a nyelvük.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #14333B;background:#0F1D24\">\n        <div style=\"padding:11px 16px;border-bottom:1px solid #14333B;display:flex;align-items:baseline;gap:10px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#7EE08A\">5.8 · FÜLEK<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:14px 16px 0\">{{ tabSample }}<\u002Fdiv>\n        <div style=\"padding:13px 16px;font-size:12.5px;line-height:18px;color:#C9E3E8;text-wrap:pretty\">A vezérlősáv <span style=\"color:#E4FAFF\">a panelé, nem a levélé<\u002Fspan>: fülváltásnál a fejléc és a vezérlősáv együtt cserélődik, mert mindkettő ugyanarról a panelről szól. A nem aktív fülből a <span style=\"color:#E4FAFF\">glif és a név<\u002Fspan> marad, és <span style=\"color:#E4FAFF\">igen, jelezhet<\u002Fspan>: pötty kerül rá, ha abban a panelben hibás státusz van vagy elszakadt a stream.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"tipusok\" style=\"padding:34px 48px;border-bottom:1px solid #14333B\">\n    <div style=\"display:flex;align-items:center;gap:14px;padding-bottom:8px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:#A06BFF\">§9<\u002Fspan>\n      <span style=\"font-size:20px;font-weight:600\">A hat típus — mit használ a vázból<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5E7F88\">a brief 5.9 · vázlat, nem terv<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:13px;line-height:19px;color:#A9C4CB;max-width:1020px;padding-bottom:20px\">A kérdés az volt, melyiknek van vezérlősáva. Válasz: <span style=\"color:#E4FAFF\">ötnek van, a SHELL-nek nincs<\u002Fspan> — és a LOGS azért kap, mert a szűrés (keresés a folyamban) a vezérlősáv dolga, a szűkítés (melyik konténer) pedig a fejlécé. Ugyanaz a sáv <span style=\"color:#E4FAFF\">nem<\u002Fspan> szolgálja ki a kettőt: ez a <a href=\"#szabaly\">§1<\u002Fa> szabálya, változatlanul.<\u002Fdiv>\n\n    <div style=\"border:1px solid #14333B;background:#0F1D24;margin-bottom:20px\">\n      <div style=\"display:grid;grid-template-columns:96px 82px 1fr 1fr 92px;padding:8px 18px;border-bottom:1px solid #14333B;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:#4C6B74\">\n        <div>TÍPUS<\u002Fdiv><div>CSALÁD<\u002Fdiv><div>FEJLÉC HORDOZZA<\u002Fdiv><div>VEZÉRLŐSÁV HORDOZZA<\u002Fdiv><div style=\"text-align:right\">SÁV<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ types }}\" as=\"t\" hint-placeholder-count=\"6\">\n        <div style=\"display:grid;grid-template-columns:96px 82px 1fr 1fr 92px;padding:9px 18px;border-bottom:1px solid #0E1E24;align-items:baseline\">\n          <div style=\"display:flex;align-items:baseline;gap:7px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#3FE0D0\">{{ t.glyph }}<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#E4FAFF\">{{ t.name }}<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;color:{{ t.famColor }};border:1px solid {{ t.famColor }};padding:0 4px;justify-self:start\">{{ t.fam }}<\u002Fspan>\n          <span style=\"font-size:12.5px;line-height:17.5px;color:#A9C4CB\">{{ t.header }}<\u002Fspan>\n          <span style=\"font-size:12.5px;line-height:17.5px;color:#A9C4CB\">{{ t.band }}<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:{{ t.bandColor }};text-align:right\">{{ t.bandTag }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px\">\n      <sc-for list=\"{{ typeSketches }}\" as=\"k\" hint-placeholder-count=\"6\">\n        <div>\n          <div style=\"display:flex;align-items:baseline;gap:10px;padding-bottom:8px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:{{ k.color }}\">{{ k.glyph }}<\u002Fspan>\n            <span style=\"font-size:14px;font-weight:600\">{{ k.name }}<\u002Fspan>\n            <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9px;color:{{ k.color }};border:1px solid {{ k.color }};padding:0 5px\">{{ k.fam }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #14333B;background:#04090C;padding:10px;display:inline-block\">{{ k.render }}<\u002Fdiv>\n          <div style=\"padding-top:9px;font-size:12.5px;line-height:18px;color:#A9C4CB\">{{ k.desc }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"widgetek\" style=\"padding:34px 48px;border-bottom:1px solid #14333B;background:#070D11\">\n    <div style=\"display:flex;align-items:center;gap:14px;padding-bottom:8px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:#A06BFF\">§10<\u002Fspan>\n      <span style=\"font-size:20px;font-weight:600\">Amit a panel hozzátesz a katalógushoz<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5E7F88\">hét új elem · a meglévők nyelvén<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:13px;line-height:19px;color:#A9C4CB;max-width:1000px;padding-bottom:20px\">Egyik sem új vizuális nyelv, és <span style=\"color:#E4FAFF\">hat a hétből könyvtári<\u002Fspan> — nulla Kubernetes-függőséggel megépíthető.<\u002Fdiv>\n    <div style=\"border:1px solid #14333B;background:#0F1D24\">\n      <div style=\"display:grid;grid-template-columns:168px 64px 1fr 84px;padding:8px 18px;border-bottom:1px solid #14333B;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:#4C6B74\">\n        <div>WIDGET<\u002Fdiv><div>RÉTEG<\u002Fdiv><div>MIT CSINÁL<\u002Fdiv><div style=\"text-align:right\">MÉRET<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ widgets }}\" as=\"w\" hint-placeholder-count=\"7\">\n        <div style=\"display:grid;grid-template-columns:168px 64px 1fr 84px;padding:9px 18px;border-bottom:1px solid #0E1E24;align-items:baseline\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#8FF5EA\">{{ w.name }}<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;color:{{ w.layerColor }};border:1px solid {{ w.layerColor }};padding:0 4px;justify-self:start\">{{ w.layer }}<\u002Fspan>\n          <span style=\"font-size:12.5px;line-height:17.5px;color:#A9C4CB\">{{ w.what }}<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:{{ w.sizeColor }};text-align:right\">{{ w.size }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:18px;padding-top:16px;flex-wrap:wrap\">\n      <div style=\"flex:1;min-width:340px;border-left:2px solid #FFB454;padding-left:14px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:#FFB454;padding-bottom:4px\">AMI A MEGLÉVŐBŐL VÁLTOZIK<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:18px;color:#A9C4CB\">A <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">Chip<\u002Fspan> kap egy <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">operator<\u002Fspan> mezőt (<span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">= / ≠<\u002Fspan>) és egy értékmenüt — eddig statikus címke volt. A <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">Table<\u002Fspan> kap egy <span style=\"color:#E4FAFF\">kétsoros sor-módot<\u002Fspan> a 420 px alatti szerkezethez. Mindkettő bővítés, nem törés.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:340px;border-left:2px solid #7EE08A;padding-left:14px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:#7EE08A;padding-bottom:4px\">AMI NEM KELL<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:18px;color:#A9C4CB\">Nincs új overlay-típus (a csipeszmenü a meglévő <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">Menu<\u002Fspan>), nincs lábléc-widget, és nincs második fejléc-változat. A nyolc állapot mind a meglévő <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">DataStateCard<\u002Fspan> és <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">Skeleton<\u002Fspan> — egyetlen új dolog köztük a <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">StaleBar<\u002Fspan>.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"atmenet\" style=\"padding:34px 48px 46px\">\n    <div style=\"display:flex;align-items:center;gap:14px;padding-bottom:8px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:#A06BFF\">§11<\u002Fspan>\n      <span style=\"font-size:20px;font-weight:600\">Az átmenet<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5E7F88\">a legkisebb lépés, ami már a végleges panelé<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:13px;line-height:19px;color:#A9C4CB;max-width:1020px;padding-bottom:20px\">A PODS panel <span style=\"color:#E4FAFF\">már megépült<\u002Fspan> valódi táblával, tehát nem nulláról indulunk. A kérdés az, mi az a legkisebb menet, ami után a maradék öt típus <span style=\"color:#E4FAFF\">nem hoz új szerkezeti döntést<\u002Fspan>.<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px\">\n      <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div style=\"border:1px solid {{ s.bd }};background:#0F1D24;display:flex;flex-direction:column\">\n          <div style=\"padding:11px 15px;border-bottom:1px solid {{ s.bd }};display:flex;align-items:baseline;gap:10px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;color:{{ s.color }}\">{{ s.n }}<\u002Fspan>\n            <span style=\"font-size:13.5px;font-weight:600;color:#E4FAFF\">{{ s.title }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:13px 15px;font-size:12.5px;line-height:18px;color:#C9E3E8;flex:1\">{{ s.body }}<\u002Fdiv>\n          <div style=\"padding:10px 15px;border-top:1px solid #12242C;display:flex;align-items:baseline;gap:9px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;color:#5E7F88\">UTÁNA<\u002Fspan>\n            <span style=\"font-size:12px;color:{{ s.color }};line-height:16px\">{{ s.usable }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1.15fr 1fr;gap:18px;padding-top:20px\">\n      <div style=\"border:1px solid #1E4C57;background:rgba(63,224,208,.05);padding:16px 19px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#3FE0D0;padding-bottom:9px\">AZ ELSŐ LÉPÉS PONTOS TARTALMA<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:19.5px;color:#C9E3E8;text-wrap:pretty\">A <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px\">PaneChrome<\u002Fspan> kiemelése a <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px\">pods_page<\u002Fspan>-ből: fejléc-cella két alakkal, vezérlősáv, és a degradációs sorrend <span style=\"color:#E4FAFF\">adatvezérelten<\u002Fspan> — egy prioritás-lista, nem elágazások sora. Plusz a namespace átköltöztetése a fejlécbe, ami a <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px\">ns:<\u002Fspan> csipesz törlése is.\n        <br><br><span style=\"color:#8FA9B2\">Nincs benne:<\u002Fspan> csipesz-bővítés, kétsoros sor-mód, állott-csík. Azok a 2–3. lépés — de a <span style=\"color:#E4FAFF\">helyük<\u002Fspan> már az elsőben megvan, tehát nem átépítés lesz, hanem bekötés.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #14333B;background:#0F1D24;padding:16px 19px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#FF4D6D;padding-bottom:9px\">A LEGNAGYOBB KOCKÁZAT ENNEK A TERVNEK<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:19.5px;color:#C9E3E8;text-wrap:pretty\">A <a href=\"#szabaly\">§1<\u002Fa> szabálya <span style=\"color:#E4FAFF\">a megvalósításról szól, nem a felhasználó fejéről<\u002Fspan>. „Okoz-e hálózati kérést\" tervezői kérdés; a felhasználó azt látja, hogy két hasonló szűkítés két különböző sávban van. A namespace és a <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px\">node:<\u002Fspan> közti különbség neki nem evidens.\n        <br><br><span style=\"color:#8FA9B2\">Visszavonulás, ha zavarónak bizonyul:<\u002Fspan> a namespace visszakerül a vezérlősáv <span style=\"color:#E4FAFF\">első<\u002Fspan> helyére, csipeszként, de <span style=\"color:#E4FAFF\">cián kerettel<\u002Fspan>, ami a fejléccel egyezik — a kapcsolat-jelleg így színnel marad meg, a helyet feladva. Ez egy token-szintű változás, a sávok szerkezetét nem érinti.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1420,&quot;height&quot;:900},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;compact&quot;,&quot;comfortable&quot;],&quot;default&quot;:&quot;compact&quot;,&quot;tsType&quot;:&quot;'compact' | 'comfortable'&quot;,&quot;section&quot;:&quot;Sűrűség&quot;}}\">\nconst C = {\n  bg: '#04090C', panel: '#0F1D24', deep: '#070D11', ink: '#0A1419', head: '#0C1A20',\n  bd: '#14333B', bd2: '#12242C', hair: '#0E1E24',\n  t1: '#E4FAFF', t2: '#A9C4CB', t3: '#5E7F88', t4: '#3B565E', t5: '#4C6B74',\n  cy: '#3FE0D0', cyL: '#8FF5EA', cyBd: '#2FB9AC', cyDk: '#1E4C57',\n  vi: '#A06BFF', viBd: '#34275C',\n  ok: '#7EE08A', warn: '#FFC24D', err: '#FF4D6D', amb: '#FFB454',\n  okBd: '#3C7A5E', warnBd: '#5A4520', errBd: '#5A2038'\n};\n\nclass Component ex
